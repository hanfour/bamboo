# XcodeGen project specification for the bamboo macOS client.
#
# We do not commit a generated *.xcodeproj — Xcode rewrites it constantly,
# and merge conflicts on its plist contents are unproductive. Run
# `xcodegen generate` (one-off `brew install xcodegen`) to materialize
# bamboo.xcodeproj from this file before opening Xcode.
#
# See README.md for full setup instructions including the Apple-side
# steps (developer team, NetworkExtension entitlement) that this file
# cannot automate.

name: bamboo
options:
  bundleIdPrefix: com.example.bamboo
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(BAMBOO_DEVELOPMENT_TEAM)"

targets:
  BambooApp:
    type: application
    platform: macOS
    sources:
      - path: BambooApp
    info:
      path: BambooApp/Info.plist
    entitlements:
      path: BambooApp/BambooApp.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bamboo.app
    dependencies:
      - target: PacketTunnelProvider

  PacketTunnelProvider:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnelProvider
    info:
      path: PacketTunnelProvider/Info.plist
    entitlements:
      path: PacketTunnelProvider/PacketTunnelProvider.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.bamboo.app.PacketTunnelProvider
