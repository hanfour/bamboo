# XcodeGen project specification for the bamboo Apple clients (macOS + iOS).
#
# We do not commit a generated *.xcodeproj — Xcode rewrites it constantly,
# and merge conflicts on its plist contents are unproductive. Run
# `xcodegen generate` (one-off `brew install xcodegen`) to materialize
# bamboo.xcodeproj from this file before opening Xcode.
#
# Bundle ID prefix is hardcoded to `dev.hanfour.bamboo`. Forks: search +
# replace this file. Earlier versions used `${BAMBOO_BUNDLE_ID_PREFIX}`
# expecting shell-style default expansion, but xcodegen passes env-var
# references through to Xcode as build-setting references (which then
# fail to resolve to anything), so a literal value is the only reliable
# path. Development team is automatically picked by Xcode from the
# signed-in Apple ID account — see README.md "Toolchain prerequisites".

name: bamboo
options:
  bundleIdPrefix: dev.hanfour.bamboo
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM left unset on purpose. With CODE_SIGN_STYLE=Automatic
    # Xcode picks the team from the signed-in Apple ID account (Xcode →
    # Settings → Accounts). Forks: log in your Apple ID, Xcode auto-selects.

# ----- Swift Package dependencies --------------------------------------------
#
# WireGuardKit is the Swift wrapper around wireguard-go. We pin to a
# patched fork (hanfour/wireguard-apple) because both upstream forks
# ship a Package.swift that declares swift-tools-version:5.3 yet uses
# .macOS(.v12) / .iOS(.v15) which require 5.5 — current Xcode rejects.
# The fork bumps the tools-version line to 5.5; the rest of the package
# is unchanged from canonical wireguard-apple HEAD (2fec12a). MIT-
# licensed. See bamboo issue #105 for the upstream context. Once
# upstream fixes its Package.swift, swap back.
packages:
  WireGuardKit:
    url: https://github.com/hanfour/wireguard-apple
    revision: 4d4eeef5a566d015254486d4d5b5e83d590edafe

# ----- macOS targets ---------------------------------------------------------

targets:
  BambooApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: BambooApp-macOS
      - path: Shared
    # Info.plist properties declared inline so xcodegen writes a real
    # file on every regen. Without `properties:`, xcodegen emits a
    # minimal stub that loses LSUIElement (so the app shows in the Dock
    # instead of the menu bar) and any custom keys we add later. Same
    # rationale as the inline entitlements declarations.
    info:
      path: BambooApp-macOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSHumanReadableCopyright: "Apache-2.0 — see LICENSE-APACHE"
        # Shown to the user in the System Extension activation prompt
        # ("'bamboo' wants to install a system extension"). Required —
        # macOS rejects the activation request without it.
        NSSystemExtensionUsageDescription: "bamboo MagicDNS resolves *.bamboo hostnames to your tailnet peers."
        # Register bamboo:// so ASWebAuthenticationSession can capture
        # the OIDC callback the controller redirects to after sign-in.
        # `callbackURLScheme: "bamboo"` on the session must match the
        # scheme listed here; without the registration, macOS silently
        # ignores the redirect and the auth flow hangs.
        CFBundleURLTypes:
          - CFBundleURLName: dev.hanfour.bamboo.auth
            CFBundleURLSchemes:
              - bamboo
    # Entitlements properties are declared inline so xcodegen writes
    # the .entitlements file with real content. Without `properties:`,
    # xcodegen emits an empty `<dict/>` on every regen — which makes
    # macOS refuse to install the NETunnelProviderManager VPN config
    # (NEVPNError Code=5, "permission denied"). See bamboo PR history
    # for the saga that uncovered this.
    entitlements:
      path: BambooApp-macOS/BambooApp.entitlements
      properties:
        # Apple's System Extension host requirement: the app that
        # submits OSSystemExtensionRequest cannot be sandboxed.
        # Tailscale's macOS app follows this same rule. sysextd will
        # silently refuse to even prompt the user otherwise (returns
        # OSSystemExtensionErrorDomain Code=4 "Extension not found
        # in App bundle" — the error message is misleading).
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        # network.server allows binding listening sockets — required
        # because pickFreeUDPPort() binds a UDP socket to discover a
        # free ephemeral port to share with WireGuard / STUN.
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          # macOS targets are signed with Developer ID Application;
          # the matching provisioning profile only grants the
          # `-systemextension` form of these entitlement values
          # (Apple Development cert previously got the plain
          # versions, but Apple stopped minting those for new
          # network-extension setups on macOS 15+). Both the
          # packet-tunnel and dns-proxy targets are System
          # Extensions sitting under Contents/Library/SystemExtensions/;
          # the host app activates each via OSSystemExtensionRequest
          # before NETunnelProviderManager / NEDNSProxyManager save.
          - packet-tunnel-provider-systemextension
          - dns-proxy-systemextension
        # Submitted via OSSystemExtensionRequest from the host app
        # — requires this entitlement so the activation request is
        # accepted by sysextd.
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups:
          - group.dev.hanfour.bamboo
    settings:
      base:
        PRODUCT_NAME: bamboo
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app
      configs:
        Release:
          # Developer ID Application signing for build-mac-dist.sh.
          # Manual style + explicit per-target profile name — the
          # Developer ID profile flow can't be auto-minted by
          # xcodebuild, so we install matching profiles ahead of
          # time under ~/Library/MobileDevice/Provisioning Profiles/
          # and reference them by their portal name here.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: bamboo app DevID
    preBuildScripts:
      - path: scripts/build-wireguardkitgo.sh
        name: Build WireGuardKitGo
    dependencies:
      - target: PacketTunnelProvider-macOS
      - target: DNSProxy-macOS
      - package: WireGuardKit
        product: WireGuardKit

  PacketTunnelProvider-macOS:
    # macOS PacketTunnelProvider runs as a System Extension on
    # macOS 15+. The App Extension form (.appex) is rejected by
    # the OS for the packet-tunnel extension point, and Apple's
    # Developer ID provisioning profile only grants the
    # `packet-tunnel-provider-systemextension` entitlement value.
    # Mirrors DNSProxy-macOS — both extensions live under
    # Contents/Library/SystemExtensions/ and are activated by
    # the host app via OSSystemExtensionRequest at launch.
    type: system-extension
    platform: macOS
    # The Network Extension target needs only the files used by the
    # PacketTunnelProvider — NOT the app-only SwiftUI / OIDC / heartbeat
    # plumbing. iOS in particular refuses to auto-link SwiftUICore into
    # an extension binary (Xcode 26.2+); macOS is more permissive but we
    # keep the surface identical so future restructures stay simple.
    sources:
      - path: PacketTunnelProvider-macOS
      - path: Shared/BambooTunnelError.swift
      - path: Shared/TunnelConfigurationBuilder.swift
      - path: Shared/TunnelIPC.swift
    # System Extensions use the NetworkExtension dict (not the
    # NSExtension dict the App Extension form uses). SYSX is the
    # required CFBundlePackageType — without it sysextd refuses to
    # discover the extension inside the host .app and the
    # OSSystemExtensionRequest fails with "Extension not found in
    # App bundle." See DNSProxy-macOS for the parallel setup.
    info:
      path: PacketTunnelProvider-macOS/Info.plist
      properties:
        CFBundleDisplayName: bamboo Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: SYSX
        # Apple requires NSSystemExtensionUsageDescription on
        # network_extension-category System Extensions; sysextd
        # rejects activation otherwise (Code=9).
        NSSystemExtensionUsageDescription: "bamboo VPN tunnel for connecting to your tailnet peers."
        # Sandboxed System Extensions require NEMachServiceName to
        # start with one of the App Group identifiers — NOT the
        # TeamIdentifierPrefix used by un-sandboxed Network
        # Extensions (Tailscale style). sysextd rejects activation
        # otherwise: "NEMachServiceName's value must be prefixed
        # with an App Group entry."
        NetworkExtension:
          NEMachServiceName: group.dev.hanfour.bamboo.tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnelProvider-macOS/PacketTunnelProvider.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider-systemextension
        # Required so NEMachServiceName (group.dev.hanfour.bamboo.tunnel)
        # is valid — sandboxed extensions need the mach service name
        # to start with an entry in application-groups.
        com.apple.security.application-groups:
          - group.dev.hanfour.bamboo
    settings:
      base:
        # PRODUCT_NAME must equal the bundle identifier so xcodegen
        # places the System Extension at
        # Contents/Library/SystemExtensions/<identifier>.systemextension/
        # — sysextd looks for the extension by ${identifier}.systemextension
        # under that directory, not by the .app's PRODUCT_NAME. Mismatch
        # → "Extension not found in App bundle" rejection (the error
        # message is misleading — the bundle is there, just not under
        # the path sysextd searches).
        PRODUCT_NAME: dev.hanfour.bamboo.app.tunnel
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app.tunnel
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: bamboo tunnel DevID
    preBuildScripts:
      - path: scripts/build-wireguardkitgo.sh
        name: Build WireGuardKitGo
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit

  DNSProxy-macOS:
    # MagicDNS resolver as a System Extension. Apple's modern path
    # for Network Extensions on macOS — App Extension form is
    # rejected by macOS 15+ for the dns-proxy extension point
    # (see PR #127 notes). System Extensions live in
    # Contents/Library/SystemExtensions/ (xcodegen places them
    # there automatically for type=system-extension) and install
    # via OSSystemExtensionRequest from the host app.
    type: system-extension
    platform: macOS
    sources:
      - path: DNSProxy-macOS
      - path: Shared/MagicDNSPeerStore.swift
      - path: Shared/MagicDNSResolver.swift
    info:
      path: DNSProxy-macOS/Info.plist
      properties:
        CFBundleDisplayName: bamboo MagicDNS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SYSX is the macOS system-extension bundle package type.
        # Without it sysextd refuses to discover the extension inside
        # the host .app and OSSystemExtensionRequest fails with
        # OSSystemExtensionErrorDomain Code=4 "Extension not found
        # in App bundle." xcodegen's type:system-extension does NOT
        # set this automatically, so we declare it inline.
        CFBundlePackageType: SYSX
        # Required on the extension itself for network_extension
        # category System Extensions (Code=9 rejection otherwise).
        NSSystemExtensionUsageDescription: "bamboo MagicDNS resolves *.bamboo hostnames to your tailnet peers."
        # System Extensions use the NetworkExtension dict — NOT the
        # NSExtension dict App Extensions use. NEMachServiceName
        # binds the IPC channel; NEProviderClasses maps the
        # extension point to our subclass.
        NetworkExtension:
          NEMachServiceName: group.dev.hanfour.bamboo.dnsproxy
          NEProviderClasses:
            com.apple.networkextension.dns-proxy: $(PRODUCT_MODULE_NAME).DNSProxyProvider
    entitlements:
      path: DNSProxy-macOS/DNSProxy_macOS.entitlements
      properties:
        # Sandbox restored (PR-followup to #153). PR #153 commit
        # 57db4d3 turned this off because /private/tmp reads returned
        # EPERM under the default sandbox profile — but disabling
        # sandbox entirely also removed mach-service constraints,
        # additional filesystem ACLs, and other defense-in-depth
        # that's worth keeping for a process running as root.
        #
        # Restore sandbox=true and grant a targeted
        # read-only exception for just the shared MagicDNS peer-map
        # file. Apple's notary accepts
        # `com.apple.security.temporary-exception.files.absolute-path.read-only`
        # for Developer ID distribution (only Mac App Store is
        # picky about these, and bamboo doesn't ship there).
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /private/tmp/dev.hanfour.bamboo.magicdns-peers.v1.json
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - dns-proxy-systemextension
        com.apple.security.application-groups:
          - group.dev.hanfour.bamboo
    settings:
      base:
        # See PacketTunnelProvider-macOS notes — PRODUCT_NAME must
        # equal the bundle identifier for sysextd to find this
        # extension inside the host .app.
        PRODUCT_NAME: dev.hanfour.bamboo.app.dnsproxy
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app.dnsproxy
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: bamboo dnsproxy DevID

# ----- test targets ----------------------------------------------------------

  AppleSharedTests:
    # Unit tests for pure-Swift logic under Shared/ that doesn't need
    # NetworkExtension (which can't be linked into a test bundle).
    # MagicDNSPeerStore + MagicDNSResolver are the two files small
    # enough + pure enough to test in isolation right now.
    #
    # The Shared/*.swift files are compiled directly into this test
    # target (rather than imported from BambooApp-macOS). This avoids
    # needing a separate framework target + @testable import for
    # what would otherwise be a single-line API surface. Each target
    # compiling its own copy of MagicDNSPeerStore.swift produces a
    # distinct Swift module-qualified type, but for tests that's
    # fine — we're testing logic, not module linkage.
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppleShared
      - path: Shared/MagicDNSPeerStore.swift
      - path: Shared/MagicDNSResolver.swift
    settings:
      base:
        # Tests don't ship; sign locally with whatever the developer
        # has. Skip the Developer ID dance the app + extensions use.
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: AppleSharedTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.tests.shared
        # SWIFT_VERSION inherits from the project-level setting.
        # GENERATE_INFOPLIST_FILE=YES so xcodegen doesn't need an
        # Info.plist sidecar for the test bundle.
        GENERATE_INFOPLIST_FILE: "YES"

# xcodegen auto-generates a scheme per target. The AppleSharedTests
# scheme will run the test target via `xcodebuild test -scheme
# AppleSharedTests` without any explicit scheme declaration here.

# ----- iOS targets -----------------------------------------------------------

  BambooApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: BambooApp-iOS
      - path: Shared
    info:
      path: BambooApp-iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSHumanReadableCopyright: "Apache-2.0 — see LICENSE-APACHE"
        # Register bamboo:// so ASWebAuthenticationSession can capture
        # the OIDC callback. See the macOS target for rationale.
        CFBundleURLTypes:
          - CFBundleURLName: dev.hanfour.bamboo.auth
            CFBundleURLSchemes:
              - bamboo
    entitlements:
      path: BambooApp-iOS/BambooApp_iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
          - dns-proxy
        com.apple.security.application-groups:
          - group.dev.hanfour.bamboo
    settings:
      base:
        PRODUCT_NAME: bamboo
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - path: scripts/build-wireguardkitgo.sh
        name: Build WireGuardKitGo
    dependencies:
      - target: PacketTunnelProvider-iOS
      - target: DNSProxy-iOS
      - package: WireGuardKit
        product: WireGuardKit

  PacketTunnelProvider-iOS:
    type: app-extension
    platform: iOS
    # Same restricted Shared/ source list as the macOS extension; see
    # PacketTunnelProvider-macOS for rationale.
    sources:
      - path: PacketTunnelProvider-iOS
      - path: Shared/BambooTunnelError.swift
      - path: Shared/TunnelConfigurationBuilder.swift
      - path: Shared/TunnelIPC.swift
    info:
      path: PacketTunnelProvider-iOS/Info.plist
      properties:
        CFBundleDisplayName: bamboo Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider_iOS
    entitlements:
      path: PacketTunnelProvider-iOS/PacketTunnelProvider_iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_NAME: bamboo-tunnel
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app.tunnel
    preBuildScripts:
      - path: scripts/build-wireguardkitgo.sh
        name: Build WireGuardKitGo
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit

  DNSProxy-iOS:
    type: app-extension
    platform: iOS
    # See DNSProxy-macOS for design rationale. iOS path-equivalent.
    sources:
      - path: DNSProxy-iOS
      - path: Shared/MagicDNSPeerStore.swift
      - path: Shared/MagicDNSResolver.swift
    info:
      path: DNSProxy-iOS/Info.plist
      properties:
        CFBundleDisplayName: bamboo MagicDNS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.dns-proxy
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DNSProxyProvider
    entitlements:
      path: DNSProxy-iOS/DNSProxy_iOS.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - dns-proxy
        com.apple.security.application-groups:
          - group.dev.hanfour.bamboo
    settings:
      base:
        PRODUCT_NAME: bamboo-dnsproxy
        PRODUCT_BUNDLE_IDENTIFIER: dev.hanfour.bamboo.app.dnsproxy
