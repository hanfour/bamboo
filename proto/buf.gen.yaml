version: v2
plugins:
  # Pin the remote plugins. An unpinned reference follows the latest
  # BSR release, and CI then rejects the tree because the version
  # comment in proto/gen no longer matches.
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=true
