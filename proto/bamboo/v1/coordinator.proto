syntax = "proto3";

package bamboo.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/hanfour/bamboo/proto/gen/go/bamboo/v1;bamboov1";

// CoordinatorService manages peer registration, network topology, and the
// long-poll stream that delivers updates to clients.
service CoordinatorService {
  // Register registers a peer with the controller, allocating an IP and
  // returning the initial peer set. Idempotent: re-registering a known
  // public key returns the existing peer.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Unregister removes a peer from the network.
  rpc Unregister(UnregisterRequest) returns (UnregisterResponse);

  // Heartbeat keeps the peer marked online. Clients call this periodically.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // WatchPeers streams peer-set and ACL updates to a client.
  rpc WatchPeers(WatchPeersRequest) returns (stream WatchPeersEvent);

  // GetPeer returns details for a single peer in the calling tenant.
  rpc GetPeer(GetPeerRequest) returns (GetPeerResponse);

  // ListPeers returns all peers visible to the caller (admin view).
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);

  // Operate is the admin desk. The device opens the stream; the
  // controller sends messages, files, and terminal input back down
  // it. The controller never dials a mesh address.
  rpc Operate(stream DeviceOperateFrame) returns (stream AdminOperateFrame);
}

// PeerStatus indicates whether a peer is reachable.
enum PeerStatus {
  PEER_STATUS_UNSPECIFIED = 0;
  PEER_STATUS_ONLINE = 1;
  PEER_STATUS_OFFLINE = 2;
  PEER_STATUS_DISABLED = 3;
}

// Peer represents a single device in the mesh.
message Peer {
  string id = 1;
  string tenant_id = 2;
  string hostname = 3;
  string wireguard_public_key = 4;
  // IP allocated within the tenant's subnet (e.g. 100.64.0.0/10).
  string ip = 5;
  repeated string tags = 6;
  string user_id = 7;
  PeerStatus status = 8;
  string os = 9;
  string client_version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp last_seen_at = 12;
  // endpoints are candidate ip:port pairs for direct connection.
  repeated string endpoints = 13;
  // allowed_ips is computed by the policy engine based on ACL rules.
  repeated string allowed_ips = 14;
  // peer_dns_name is the short DNS-safe label this peer is reachable
  // under within the tenant's MagicDNS zone (resolves to
  // "<peer_dns_name>.bamboo"). Empty for legacy peers registered
  // before MagicDNS landed; the coordinator auto-slugifies the
  // hostname on the next register to backfill.
  string peer_dns_name = 15;
  // approval_status is the device-approval lifecycle gate (issue
  // #133). One of "pending", "approved", "rejected". Pending peers
  // appear in the Register response (so the client knows it is
  // queued) but never appear in OTHER peers' Register / WatchPeers
  // responses until an admin approves. Rejected peers reach a
  // terminal state; their pubkey is unusable until an admin deletes
  // the row. Empty in legacy responses pre-#133 — clients should
  // treat empty as "approved" for backward compatibility.
  string approval_status = 16;

  // ip6 is the peer's deterministic IPv6 ULA, derived from its IPv4
  // (the v4's 32 bits embedded in the low 32 bits of the tenant's /64
  // pool). Empty in legacy responses; clients ignore empty.
  string ip6 = 17;
}

message RegisterRequest {
  // Either bearer token (from interactive login) or pre_auth_key_secret.
  oneof credential {
    string bearer_token = 1;
    string pre_auth_key_secret = 2;
  }
  string hostname = 3;
  string wireguard_public_key = 4;
  string os = 5;
  string client_version = 6;
  // STUN-discovered host:port candidates the peer is reachable on.
  // May be empty on first call; the client typically reports them on
  // the next Heartbeat once discovery completes.
  repeated string endpoints = 7;
}

message RegisterResponse {
  Peer self = 1;
  repeated Peer peers = 2;
  // policy_revision is monotonically increasing and used for cache invalidation.
  int64 policy_revision = 3;
  // relay_servers are DERP-style relays the client may use as fallback.
  repeated RelayServer relay_servers = 4;
  // preferred_region is the controller's best guess at the client's
  // region (§4 P2 multi-relay stage 5.5). Derived from the client's
  // request IP against an operator-supplied CIDR table. Empty when no
  // table is configured or no CIDR matches — clients then fall back
  // to pure RTT ranking or their own local region hint.
  //
  // Clients precedence: local hint (env / Settings) wins over this
  // server-supplied value. The server hint is the "fleet-wide
  // default"; an individual operator may still override per-device.
  string preferred_region = 5;

  // dns64_enabled tells the client to turn on DNS64 synthesis (NAT64
  // Phase B). Per-tenant, default false — false / absent on a legacy
  // controller means "leave DNS64 off".
  bool dns64_enabled = 6;

  // nat64_prefix is the resolved /96 the client synthesises into when
  // dns64_enabled is true (the well-known 64:ff9b::/96 substituted for
  // an unset per-tenant override). Empty on a legacy controller.
  string nat64_prefix = 7;

  // nat64_egress_active tells THIS peer it should run a NAT64 translator
  // (NAT64 Phase C2): true when the peer is the tenant's approved egress
  // AND dns64_enabled is on. The CLI brings Tayga up/down on this edge.
  bool nat64_egress_active = 8;
}

message RelayServer {
  string id = 1;
  string region = 2;
  string hostname = 3;
  int32 port = 4;
  string public_key = 5;
}

message UnregisterRequest {
  string peer_id = 1;
}

message UnregisterResponse {}

message HeartbeatRequest {
  string peer_id = 1;
  int64 known_policy_revision = 2;
  // current endpoints observed by the client (NAT type, public ip:port).
  repeated string endpoints = 3;
}

message HeartbeatResponse {
  // tells the client whether to refresh its peer set / ACL.
  bool peers_changed = 1;
  bool policy_changed = 2;
  int64 current_policy_revision = 3;
}

message WatchPeersRequest {
  string peer_id = 1;
  int64 known_policy_revision = 2;
}

// WatchPeersEvent delivers incremental updates over the long-poll stream.
message WatchPeersEvent {
  oneof event {
    PeerAdded peer_added = 1;
    PeerUpdated peer_updated = 2;
    PeerRemoved peer_removed = 3;
    PolicyChanged policy_changed = 4;
    RelaysChanged relays_changed = 5;
  }
}

message PeerAdded {
  Peer peer = 1;
}

message PeerUpdated {
  Peer peer = 1;
}

message PeerRemoved {
  string peer_id = 1;
}

message PolicyChanged {
  int64 policy_revision = 1;
}

message RelaysChanged {
  repeated RelayServer relay_servers = 1;
}

message GetPeerRequest {
  string peer_id = 1;
}

message GetPeerResponse {
  Peer peer = 1;
}

message ListPeersRequest {
  int32 page_size = 1;
  string page_token = 2;
  // optional filter expression — see AIP-160.
  string filter = 3;
}

message ListPeersResponse {
  repeated Peer peers = 1;
  string next_page_token = 2;
}

// DeviceOperateFrame is one frame on the device-to-controller half of
// Operate. The first frame is hello. Later frames are results and
// terminal output.
message DeviceOperateFrame {
  oneof frame {
    DeviceOperateHello hello = 1;
    DeviceOperateResult result = 2;
    DeviceOperateOutput output = 3;
  }
}

// DeviceOperateHello binds the stream to the device's peer and reports
// whether that device will accept a terminal.
message DeviceOperateHello {
  string peer_id = 1;
  bool exec_enabled = 2;
}

// DeviceOperateResult answers one admin operation. A terminal start
// sends this twice: once when the shell is open, and again when it
// exits. exit_code is meaningful on that second result.
message DeviceOperateResult {
  string op_id = 1;
  bool ok = 2;
  string error = 3;
  int32 exit_code = 4;
  bytes data = 5;
}

// DeviceOperateOutput is terminal bytes for an open shell. op_id is
// the pty_start operation those bytes belong to.
message DeviceOperateOutput {
  string op_id = 1;
  bytes data = 2;
}

// AdminOperateFrame is one frame on the controller-to-device half of
// Operate.
message AdminOperateFrame {
  oneof frame {
    AdminOperateMsg msg = 1;
    AdminOperatePut put = 2;
    AdminOperateGet get = 3;
    AdminOperatePTYStart pty_start = 4;
    AdminOperatePTYIn pty_in = 5;
    AdminOperatePTYWinsize pty_winsize = 6;
    AdminOperatePTYClose pty_close = 7;
  }
}

// AdminOperateMsg appends text to the device inbox. from is the admin
// identity, not a WireGuard key.
message AdminOperateMsg {
  string op_id = 1;
  string from = 2;
  string text = 3;
}

// AdminOperatePut writes a file inside the device session directory.
message AdminOperatePut {
  string op_id = 1;
  string path = 2;
  bytes data = 3;
}

// AdminOperateGet reads a file from the device session directory.
message AdminOperateGet {
  string op_id = 1;
  string path = 2;
}

// AdminOperatePTYStart opens a shell. An empty argv asks the device
// for its default shell.
message AdminOperatePTYStart {
  string op_id = 1;
  repeated string argv = 2;
  int32 rows = 3;
  int32 cols = 4;
}

// AdminOperatePTYIn is keystrokes for the shell opened by pty_start.
message AdminOperatePTYIn {
  string op_id = 1;
  bytes data = 2;
}

// AdminOperatePTYWinsize changes the shell window size.
message AdminOperatePTYWinsize {
  string op_id = 1;
  int32 rows = 2;
  int32 cols = 3;
}

// AdminOperatePTYClose asks the device to stop the shell.
message AdminOperatePTYClose {
  string op_id = 1;
}
