# Single-VPS production-ish deployment of the entire bamboo stack.
#
# Same code as the local stack (infra/local/) but with:
#   - Caddy in front terminating Let's Encrypt TLS for both
#     <DOMAIN> and <RELAY_DOMAIN>
#   - controller, web, relay all on the internal docker network
#   - postgres + clickhouse not exposed on host ports (internal only)
#
# Intended for a single VPS (e.g. Hetzner CX22, Vultr Tokyo $5).
# See docs/deployment/single-vps.md for the end-to-end walkthrough.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bamboo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bamboo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bamboo -d bamboo"]
      interval: 5s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: bamboo
      CLICKHOUSE_USER: bamboo
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "bamboo", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  controller:
    image: ghcr.io/hanfour/bamboo-controller:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://bamboo:${POSTGRES_PASSWORD}@postgres:5432/bamboo?sslmode=disable"
      CLICKHOUSE_URL: "http://bamboo:${CLICKHOUSE_PASSWORD}@clickhouse:8123/bamboo"
      BAMBOO_SESSION_SECRET: "${BAMBOO_SESSION_SECRET}"
      # Dedicated relay-token signing key (audit C-1). Isolated from the
      # session secret so a relay-host compromise can't forge session
      # JWTs. Falls back to the session secret when BAMBOO_RELAY_SECRET is
      # unset — must match the relay's BAMBOO_RELAY_SHARED_SECRET below.
      BAMBOO_RELAY_SECRET: "${BAMBOO_RELAY_SECRET:-${BAMBOO_SESSION_SECRET}}"
      # Ed25519 relay-token signing (audit C-1 root fix). When set, the
      # controller signs relay tokens with this private key and the relay
      # verifies with only BAMBOO_RELAY_PUBLIC_KEY below — so the relay
      # holds nothing that could forge tokens. Empty ⇒ the HMAC path above.
      # Generate a pair with: docker compose run --rm controller relaykey
      BAMBOO_RELAY_SIGNING_KEY: "${BAMBOO_RELAY_SIGNING_KEY:-}"
      BAMBOO_BASE_URL: "https://${DOMAIN}"
      BAMBOO_GRPC_ADDR: "0.0.0.0:8080"
      BAMBOO_HTTP_ADDR: "0.0.0.0:8081"
      OIDC_GOOGLE_CLIENT_ID: "${OIDC_GOOGLE_CLIENT_ID:-}"
      OIDC_GOOGLE_CLIENT_SECRET: "${OIDC_GOOGLE_CLIENT_SECRET:-}"
      OIDC_GITHUB_CLIENT_ID: "${OIDC_GITHUB_CLIENT_ID:-}"
      OIDC_GITHUB_CLIENT_SECRET: "${OIDC_GITHUB_CLIENT_SECRET:-}"
      # Prod default is auth-required: the REST /api/v1/* surface
      # rejects unauthenticated requests with 401 instead of falling
      # back to the X-Tenant-Slug dev path. Override to "false" in
      # .env only when you need to reproduce a dev-mode bug against
      # this stack. The local make-local-up stack runs with
      # require_auth=false by default (see infra/local/docker-compose.yml).
      # Note: peer onboarding REST paths (/peers/register, /peers/heartbeat,
      # /peers/watch) and /api/v1/relay-token still short-circuit before
      # this gate; closing those bypasses is tracked under issue #135
      # phase 2. See apps/controller/internal/config/config.go for the
      # underlying flag.
      BAMBOO_REQUIRE_AUTH: "${BAMBOO_REQUIRE_AUTH:-true}"
      # wg-state reporter: reads the host-side dump produced by
      # wg-state-reporter.timer and reconciles peer liveness into
      # the DB. Empty path disables; controller HTTP is unaffected.
      BAMBOO_WG_STATE_PATH: "/var/lib/bamboo/wg-state.txt"
    volumes:
      # Read-only mount; the host timer writes via mv(1) so the
      # controller never sees a half-written dump.
      - /var/lib/bamboo:/var/lib/bamboo:ro
    command: ["serve", "--log-json"]

  web:
    image: ghcr.io/hanfour/bamboo-web:latest
    restart: unless-stopped
    depends_on:
      - controller
    environment:
      # Inside the docker network, web talks to controller by service
      # name. From the browser's perspective the same controller is
      # reachable at https://${DOMAIN} via Caddy.
      BAMBOO_API_URL: "http://controller:8081"
      BAMBOO_TENANT: "default"

  relay:
    image: ghcr.io/hanfour/bamboo-relay:latest
    restart: unless-stopped
    environment:
      # Must equal the controller's BAMBOO_RELAY_SECRET so relay tokens
      # verify. Same fallback expression keeps them in lockstep whether or
      # not a dedicated relay secret is set (audit C-1). Ignored when a
      # public key is set below (Ed25519 takes precedence).
      BAMBOO_RELAY_SHARED_SECRET: "${BAMBOO_RELAY_SECRET:-${BAMBOO_SESSION_SECRET}}"
      # Ed25519 public key matching the controller's BAMBOO_RELAY_SIGNING_KEY
      # (audit C-1 root fix). When set, the relay verifies asymmetrically and
      # holds NO forge-capable secret. Empty ⇒ the HMAC path above.
      BAMBOO_RELAY_PUBLIC_KEY: "${BAMBOO_RELAY_PUBLIC_KEY:-}"
    command: ["--addr=:8443", "--dev-plaintext"]
    # Plaintext inside the docker network; Caddy adds TLS in front.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: "${DOMAIN}"
      RELAY_DOMAIN: "${RELAY_DOMAIN}"
    depends_on:
      - controller
      - web
      - relay

volumes:
  postgres-data:
  clickhouse-data:
  caddy-data:
  caddy-config:
