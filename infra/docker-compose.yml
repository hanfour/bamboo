# Local development stack.
# Usage: from repo root, run `make dev`.
#
# This file is a placeholder. Real services will be wired up as components
# come online during Sprint 1.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bamboo
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: bamboo
    # Non-default host ports to avoid conflicts with system / other-project services.
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bamboo -d bamboo"]
      interval: 2s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  # controller:
  #   build: ../apps/controller
  #   depends_on: [postgres, redis]
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DATABASE_URL: postgres://bamboo:dev@postgres:5432/bamboo
  #     REDIS_URL: redis://redis:6379

  # Local relay for end-to-end testing on a single host. Production
  # deploys live in infra/relay/ with a Caddy reverse-proxy + Let's
  # Encrypt; see docs/deployment/relay-on-vps.md.
  relay:
    profiles: ["relay"]
    build:
      context: ..
      dockerfile: infra/relay/Dockerfile
    ports:
      - "18443:8443"
    environment:
      BAMBOO_RELAY_SHARED_SECRET: this-is-a-development-secret-do-not-use-in-production-pls
    command: ["--addr=:8443", "--dev-plaintext"]

  # web:
  #   build: ../apps/web
  #   depends_on: [controller]
  #   ports:
  #     - "3000:3000"

volumes:
  postgres-data:
