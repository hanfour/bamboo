# Example controller configuration.
# Copy to config.yaml and adjust. Secrets should come from env vars
# (DATABASE_URL, OIDC_*_CLIENT_SECRET, ...) — do not commit them here.

server:
  grpc_addr: 0.0.0.0:8080
  http_addr: 0.0.0.0:8081

database:
  # Local dev maps Postgres to host port 15432 (avoids conflicts).
  # In Docker / production use the cluster-internal hostname and standard 5432.
  # Override at runtime via DATABASE_URL.
  url: postgres://bamboo:dev@localhost:15432/bamboo?sslmode=disable

redis:
  # Local dev maps Redis to host port 16379. Override via REDIS_URL.
  url: redis://localhost:16379

auth:
  # 32+ bytes. Generate with `openssl rand -base64 48`.
  # Override via BAMBOO_SESSION_SECRET (recommended; do not commit).
  session_secret: "this-is-a-development-secret-do-not-use-in-production-pls"
  session_ttl: "24h"
  oidc:
    # Public URL of the HTTP listener; used to build OIDC redirect URIs.
    # Override via BAMBOO_BASE_URL.
    base_url: "http://localhost:8081"
    google:
      client_id: ""
      # Override via OIDC_GOOGLE_CLIENT_SECRET.
      client_secret: ""
    github:
      client_id: ""
      # Override via OIDC_GITHUB_CLIENT_SECRET.
      client_secret: ""
