[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bamboo-ai"
version = "0.0.1"
description = "Tier-2 ML pipeline for bamboo: per-tenant anomaly detection and policy mining."
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "clickhouse-connect>=0.7,<1",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
bamboo-ai = "anomaly.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anomaly"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
