name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: "v2.0.2"
  BUF_VERSION: "v1.45.0"
  PROTOC_GEN_GO_VERSION: "v1.36.11"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.5.1"
  GOOSE_VERSION: "v3.27.1"
  # Opt into Node.js 24 for JS-based actions (actions/checkout,
  # docker/build-push-action, etc.) ahead of GitHub's forced switch
  # on 2026-06-02 and Node 20 removal on 2026-09-16. This is the
  # vendor-recommended path until each individual action ships a
  # Node 24 release; doing it via env keeps us from chasing six
  # separate @v5/@v6 bumps, each requiring its own compatibility
  # check. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  license-headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-license-headers.sh

  proto:
    name: Proto lint + drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install buf and protoc plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@${{ env.PROTOC_GEN_GO_GRPC_VERSION }}
      - name: Lint protos
        working-directory: proto
        run: buf lint
      - name: Verify generated code is current
        run: |
          cd proto && buf generate
          if ! git diff --quiet --exit-code -- gen; then
            echo "::error::proto/gen is out of date. Run 'make proto' and commit." >&2
            git --no-pager diff -- gen
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      - name: Lint
        run: make lint

  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bamboo
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: bamboo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bamboo -d bamboo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: bamboo
          CLICKHOUSE_USER: bamboo
          CLICKHOUSE_PASSWORD: dev
        ports:
          - 9000:9000
          - 8123:8123
        # clickhouse-client ships in the image, so the healthcheck does
        # not depend on busybox-wget's flag set. RBAC management is
        # left off here (we only need CRUD on a single DB) so first-
        # boot init stays fast on slower GitHub-hosted runners.
        options: >-
          --health-cmd "clickhouse-client --user bamboo --password dev --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      DATABASE_URL_TEST: postgres://bamboo:dev@localhost:5432/bamboo?sslmode=disable
      CLICKHOUSE_URL_TEST: clickhouse://bamboo:dev@localhost:9000/bamboo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }}
          $(go env GOPATH)/bin/goose -dir apps/controller/migrations postgres "$DATABASE_URL_TEST" up
      - name: Test
        run: make test

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    needs: [lint, license-headers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: make build
      - name: Smoke test
        run: ./bin/controller version

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  ai:
    name: AI (Python lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai/pyproject.toml
      - run: pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
